# PlatformIO project file for the ESP-IDF rewrite — sibling to esp32/
# (the Arduino version), kept around as a working reference during
# migration rather than replaced outright.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Per zenoh-pico's own README, its documented "ESP-IDF" integration is
; PlatformIO's framework=espidf using this same lib_deps line -- not the
; ESP Component Registry, not a hand-built components/ folder. Same
; pinned-tag reasoning as esp32/platformio.ini: floating on the bare
; GitHub URL resolves once and then never updates, which is what caused
; the z_loan_mut error there.
lib_deps =
    https://github.com/eclipse-zenoh/zenoh-pico.git#1.10.0

; zenoh-pico's extra_script.py *does* detect framework=espidf and tries to
; set -DZENOH_ESPIDF automatically, but it does so by appending to SCons'
; env/projenv/global_env -- the propagation trick that works for
; framework=arduino/mbed/zephyr/generic, all of which compile straight
; through SCons. framework=espidf instead hands compilation off to
; PlatformIO's generated CMake/idf.py component build, which never reads
; those SCons defines back, so the macro never reaches the actual
; xtensa-gcc invocation and platform.h falls through to
; #error "Unknown platform". Defining it directly here sidesteps that gap
; entirely -- same fallback zenoh-pico's own docs suggest, and the same
; pattern already noted (commented out) in esp32/platformio.ini.
build_flags =
    -DZENOH_ESPIDF
