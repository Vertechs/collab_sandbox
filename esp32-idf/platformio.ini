# PlatformIO project file for the ESP-IDF rewrite — sibling to esp32/
# (the Arduino version), kept around as a working reference during
# migration rather than replaced outright.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    https://github.com/eclipse-zenoh/zenoh-pico.git

build_flags =
    -DZENOH_ESPIDF
