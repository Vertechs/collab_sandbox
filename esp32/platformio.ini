# PlatformIO project file — lives at firmware/platformio.ini
# Board matches the ESP32 DEVKIT V1 (Elegoo clone) you've been using —
# "esp32dev" is PlatformIO's generic ESP32-WROOM dev board profile, the
# same silicon Arduino IDE's "ESP32 Dev Module" targets.

[env:esp32dev]
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino, espidf
monitor_speed = 115200

monitor_filters = esp32_exception_decoder

lib_deps =
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit TMP117
    adafruit/Adafruit SH110X
    https://github.com/eclipse-zenoh/zenoh-pico

; zenoh-pico's own library.json declares "arduino" framework support and an
; extra_script.py PlatformIO's build system runs automatically — this is
; the exact step that couldn't happen under Arduino IDE. If you still hit a
; build error referencing a missing feature/config, check
; examples/*/platformio.ini inside your cloned zenoh-pico for whatever
; build_flags that example pins (it's moved around across versions —
; -DZENOH_ESP32=1 and -DZENOH_ARDUINO_ESP32 -DZENOH_COMPILER_GCC have both
; shown up depending on commit), and copy it in below.
; build_flags =
;     -DZENOH_ESP32=1
