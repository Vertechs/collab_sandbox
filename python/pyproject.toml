[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "collab-python-lib"
version = "0.1.0"
description = "Shared Python library scaffold for other projects"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Your Name" }]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
